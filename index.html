    <meta charset="UTF-8">

    <style>
        .widget { position: absolute; min-width: 50px; min-height: 50px; overflow: hidden; opacity: 0; transition: opacity 0.5s; }
        .edit-mode-active { outline: 2px dashed #00f2ff !important; box-shadow: 0 0 15px #00f2ff !important; cursor: move !important; z-index: 10000 !important; }
        .resize-mode-active { outline: 2px dashed #ffcc00 !important; cursor: nwse-resize !important; overflow: auto !important; resize: both !important; }
        #login-modal { z-index: 99999; }
        .online-user-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .user-name-label { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: context-menu; }
        .unverified-text { text-decoration: line-through; opacity: 0.5; filter: grayscale(1); }
        .system-msg { color: #ffcc00; font-weight: bold; text-align: center; font-size: 13px; padding: 12px; background: rgba(255, 204, 0, 0.1); border-radius: 8px; margin: 8px; border: 1px dashed #ffcc00; display: block; }
        #context-menu { position: fixed; display: none; background: rgba(10,10,10,0.98); border: 1px solid #00f2ff; color: #fff; padding: 5px 0; z-index: 100000; min-width: 180px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); border-radius: 8px; }
        .menu-item { padding: 12px 15px; font-size: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: #00f2ff; color: #000; }
        .menu-danger { color: #ff4b2b; }
        .menu-success { color: #00fc00; }
        #tools-widget { opacity: 0.3; pointer-events: none; transition: 0.5s; }
        .chat-msg-row { cursor: context-menu; transition: background 0.2s; border-radius: 4px; padding: 2px 8px; margin-bottom: 4px; line-height: 1.2; word-wrap: break-word; }
        .verify-box { width: 18px; height: 18px; border: 1px solid #444; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; margin-right: 8px; }
        .tick-f { background: #00f2ff; color: #000; border-color: #00f2ff; }
        .tick-v { background: #00fc00; color: #000; border-color: #00fc00; }
    </style>
</head>

<script>
    // Turso/Cloudflare Workers backend kaldırıldı - sistem tamamen Firebase üzerinden çalışıyor.

    const firebaseConfig = { apiKey: "AIzaSyBeMsSLTbpmjzd7HrVKjhFIVAQ_goJsLUg", authDomain: "flat-chat-fa830.firebaseapp.com", databaseURL: "https://flat-chat-fa830-default-rtdb.europe-west1.firebasedatabase.app", projectId: "flat-chat-fa830" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const rootNick = "Filiz Yeşili FM";

    const rolePriority = { 
        "Kurucu": 100, "KURUCU": 100,
        "Yönetici": 90, "YÖNETİCİ": 90, "Yonetici": 90,
        "Admin": 80, "ADMİN": 80,
        "Teknik Servis": 70, "TEKNİK SERVİS": 70, "Teknik Ekip": 70,
        "Dj": 60, "DJ": 60,
        "Üye": 20, "ÜYE": 20, "Uye": 20,
        "Misafir": 10, "MİSAFİR": 10
    };

    let myName = sessionStorage.getItem("filiz_chat_nick") || "";
    let loginTime = Date.now(); 
    let currentColor = localStorage.getItem("filiz_chat_color") || "#00f2ff";
    let isVerified = false, fontSize = 14, myRole = "Misafir", isBold = false, isItalic = false;
    let myPerms = {}; let allRoles = {}; let draggies = [];
    const widgetIds = ['chat-widget', 'input-widget', 'online-widget', 'login-widget', 'tools-widget', 'count-widget'];

    window.onload = () => { 
        initEmojis(); 
        loadLayout(); 
        fetchRolesAndUsers(); 
        checkBanStatus();
        document.getElementById('current-color-btn').style.background = currentColor;

        if (!myName) {
            const randomId = Math.floor(1000 + Math.random() * 9000);
            myName = "Guest" + randomId;
            sessionStorage.setItem("filiz_chat_nick", myName);
        }
        startAuth(); 
        startCounter();
        listenForKick();
    };

    // --- Güvenlik: mesaj metnindeki HTML özel karakterlerini zararsız hale getirir ---
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
    }

    // --- URL/link tespiti: metin içindeki http(s):// veya www. ile başlayan adresleri tıklanabilir linke çevirir ---
    // NOT: text parametresi ÖNCE escapeHtml'den geçmiş olmalı, yoksa zararlı kod linke çevrilebilir.
    function linkify(escapedText) {
        const urlPattern = /((https?:\/\/|www\.)[^\s<]+)/gi;
        return escapedText.replace(urlPattern, (match) => {
            let href = match;
            if (!/^https?:\/\//i.test(href)) href = 'https://' + href;
            // Cümle sonu noktalama işaretlerini (. , ! ? gibi) linkin dışında bırak
            const trailingPunctMatch = match.match(/[.,!?;:]+$/);
            let trailing = '';
            let linkText = match;
            if (trailingPunctMatch) {
                trailing = trailingPunctMatch[0];
                linkText = match.slice(0, -trailing.length);
                href = href.slice(0, href.length - trailing.length);
            }
            return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:#00f2ff; text-decoration:underline; word-break:break-all;">${linkText}</a>${trailing}`;
        });
    }

    function loadMessages() {
        const win = document.getElementById('chat-window');
        if (!win) return; 
        db.ref('messages').off(); 
        win.innerHTML = "";

        if (!isVerified) {
            win.innerHTML = `<div class="system-msg" style="border:none; background:none; color:#ff4b2b;">🔒 Sohbeti görmek için onay bekleniyor...</div>`;
            return;
        }
        
        db.ref('messages').limitToLast(50).on('child_added', s => {
            const d = s.val();
            if (!d.timestamp || d.timestamp < loginTime) {
                return; 
            }
            const oldSystemMsg = win.querySelector('.system-msg');
            if (oldSystemMsg && d.type !== "system") {
                oldSystemMsg.remove();
            }

            const mRow = document.createElement('div');
            mRow.id = "msg-" + s.key;
            
            if(d.type === "system") {
                mRow.className = "system-msg";
                mRow.innerText = d.m;
                win.prepend(mRow);

                setTimeout(() => {
                    const target = document.getElementById("msg-" + s.key);
                    if (target) {
                        target.style.transition = "opacity 0.8s";
                        target.style.opacity = "0";
                        setTimeout(() => target.remove(), 800);
                    }
                }, 10000); 
                return; 
            }

            mRow.className = "chat-msg-row";
            const nCol = d.uc || d.c || "#00f2ff";
            const italicStyle = d.i ? "font-style: italic; display: inline-block; transform: skewX(-15deg); margin-left: 3px;" : "";
            
            mRow.style.cssText = `color:${d.c}; font-weight:${d.b ? 'bold' : 'normal'}; font-size:${fontSize}px; margin-bottom: 5px;`;
            const safeMsg = linkify(escapeHtml(d.m));
            mRow.innerHTML = `<b style="color:${nCol}; margin-right: 5px; font-style: normal;">${escapeHtml(d.u)} :</b><span style="${italicStyle}">${safeMsg}</span>`;
            
            mRow.oncontextmenu = (e) => createContextMenu(e, { msgKey: s.key, name: d.u });
            win.prepend(mRow);
        });
        
        db.ref('messages').on('child_removed', s => { 
            const el = document.getElementById("msg-" + s.key); 
            if(el) el.remove(); 
        });
    }

    document.getElementById('msg').onkeypress = async (e) => { 
        if(e.key === "Enter" && e.target.value.trim() !== "") { 
            if(isVerified) { 
                db.ref('messages').push().set({ 
                    u: myName, 
                    m: e.target.value, 
                    c: currentColor, 
                    uc: currentColor, 
                    b: isBold, 
                    i: isItalic,
                    timestamp: Date.now() 
                }); 
                e.target.value = ""; 
            } else {
                alert("Sohbet izniniz henüz onaylanmamış!");
            }
        } 
    };

    function startCounter() {
        db.ref('presence').on('value', (snapshot) => {
            // NOT: Eskiden snapshot.numChildren() kullanılıyordu, bu presence altındaki HER kaydı
            // sayıyordu (name alanı olmayan "hayalet"/yarım kalmış kayıtlar dahil). Bu yüzden sayaç,
            // görünen nick listesinden (loadUsers - sadece name'i dolu olanları sayar) farklı çıkıyordu.
            // Artık aynı kurala göre sayıyoruz: sadece geçerli bir "name" alanı olan kayıtlar sayılır.
            let validCount = 0;
            snapshot.forEach(u => {
                const ud = u.val();
                if (ud && ud.name) validCount++;
            });

            const countElement = document.getElementById('total-user-count');
            if (countElement) {
                countElement.innerText = validCount;
            }
        });
    }

    function loadLayout() {
        db.ref('layout').once('value', s => {
            const d = s.val() || {};
            widgetIds.forEach(id => {
                const el = document.getElementById(id);
                if (el && d[id]) {
                    el.style.left = d[id].x + "px";
                    el.style.top = d[id].y + "px";
                    el.style.width = d[id].w + "px";
                    el.style.height = d[id].h + "px";
                    el.style.transform = "none"; 
                }
                if (el) el.style.opacity = "1";
            });
        });
    }

    async function startAuth() {
        const presenceRef = db.ref('presence/' + myName);
        presenceRef.onDisconnect().remove();

        db.ref('users/' + myName).on('value', async s => {
            const ud = s.val() || {};
            myRole = ud.role || "Misafir";
            
            if (myRole !== "Kurucu") {
                const pSnap = await db.ref('permissions/' + myRole).once('value');
                myPerms = pSnap.val() || {};
            } else {
                myPerms = { canAccessAdmin: true, canBan: true, canKick: true, canUseColors: true, canClearChat: true, canDeleteMsgs: true };
            }

            db.ref('presence/' + myName).on('value', ps => {
                const pd = ps.val() || {};
                const isF = ud.isVerified === true;
                const isV = pd.tempVerify === true;
                isVerified = (isF || isV); 

                const authBtn = document.getElementById('auth-btn');
                const msgInput = document.getElementById('msg');
                const toolsWidget = document.getElementById('tools-widget');

                if (myName && !myName.startsWith("Guest")) {
                    authBtn.innerText = "👤 " + myName;
                    authBtn.style.color = "#00fc00";
                } else {
                    authBtn.innerText = "GİRİŞ YAP";
                    authBtn.style.color = "#00f2ff";
                }

                if (isVerified) {
                    if(msgInput) { msgInput.disabled = false; msgInput.placeholder = "Mesajınızı yazın..."; }
                    if(toolsWidget) { toolsWidget.style.opacity = "1"; toolsWidget.style.pointerEvents = "auto"; }
                } else {
                    if(msgInput) { msgInput.disabled = true; msgInput.placeholder = "Onay bekleniyor..."; }
                    if(toolsWidget) { toolsWidget.style.opacity = "0.3"; toolsWidget.style.pointerEvents = "none"; }
                }
                
                loadMessages();
                // checkBanViewPerms(); // BANLILAR widget'ı kaldırıldığı için artık çağrılmıyor
            });

            presenceRef.set({
                name: myName,
                role: myRole,
                isVerified: ud.isVerified || false,
                tempVerify: false,
                color: currentColor,
                lastSeen: firebase.database.ServerValue.TIMESTAMP
            });
        });

        loadUsers();
    }

    function loadUsers() {
        db.ref('presence').on('value', s => {
            const list = document.getElementById('user-list'); 
            if(!list) return;
            list.innerHTML = "";
            
            let usersArray = [];
            s.forEach(u => {
                const ud = u.val();
                if(ud.name) usersArray.push(ud);
            });

            usersArray.sort((a, b) => {
                const priorityA = rolePriority[a.role] || 0;
                const priorityB = rolePriority[b.role] || 0;
                return priorityB - priorityA; 
            });

            usersArray.forEach(ud => {
                const isAdmin = (myRole === "Kurucu" || myRole === "Yönetici" || myRole === "Admin" || myRole === "Dj" || (myPerms && myPerms.canAccessAdmin));
                const hasP = ud.isVerified === true; 
                const hasT = ud.tempVerify === true; 
                const isApproved = (hasP || hasT); 

                const showRole = (ud.role !== "Üye" && ud.role !== "Misafir");

                const div = document.createElement('div'); 
                div.className = "online-user-row-container";
                
                let verifyClass = hasP ? 'tick-f' : (hasT ? 'tick-v' : '');
                let verifyIcon = hasP ? 'F' : (hasT ? '✓' : '');

                div.innerHTML = `
                    <div class="online-user-row">
                        <div class="verify-box ${verifyClass}" onclick="quickVerify('${ud.name}', ${isApproved})">
                            ${verifyIcon}
                        </div>
                        <span class="user-name-label ${isApproved ? '' : 'unverified-text'}" 
                              style="color:${ud.color || '#fff'}; cursor:pointer;" 
                              onclick="toggleUserActions('${ud.name}')">
                            ● ${ud.name} 
                            ${showRole ? `<small style="opacity:0.6; font-size:10px; display: inline-block;">[${ud.role || 'Misafir'}]</small>` : ''}
                        </span>
                    </div>
                    ${isAdmin && ud.name !== myName ? `
                    <div id="actions-${ud.name.replace(/\s+/g, '_')}" class="quick-action-panel">
                        <div class="action-btn btn-kick" onclick="kickUser('${ud.name}')">SOHBETTEN AT</div>
                        <div class="action-btn btn-ban" onclick="quickBanUser('${ud.name}')">KALICI BANLA</div>
                    </div>
                    ` : ''}
                `;
                list.appendChild(div);
            });
        });
    }

    function createContextMenu(e, t = null) { 
        e.preventDefault(); 
        const menu = document.getElementById('context-menu'); 
        menu.innerHTML = ""; 

        const canSeeAdminPanel = (myRole === "Kurucu" || myPerms.canAccessAdmin);
        const canClear = (myRole === "Kurucu" || myPerms.canClearChat); 
        const canDelete = (myRole === "Kurucu" || myPerms.canDeleteMsgs); 
        const canBan = (myRole === "Kurucu" || myPerms.canBan); 

        if(canSeeAdminPanel) {
            addMenuItem(menu, "⚙ YÖNETİM PANELİ", () => window.open('admin.html', '_blank'), "menu-success"); 
        }
        if(t && t.msgKey && canDelete) {
            addMenuItem(menu, "🗑 MESAJI SİL", () => { 
                if(confirm("Bu mesajı silmek istiyor musunuz?")) db.ref('messages/'+t.msgKey).remove(); 
            }, "menu-danger");
        }
        if(canClear) {
            addMenuItem(menu, "🔥 SOHBETİ TEMİZLE", () => clearMsgs(), "menu-danger");
        }
        if(t && t.name && canBan && t.name !== myName) {
            const myRank = rolePriority[myRole] || 0;
            const targetRank = rolePriority[t.role] || 0;
            if (myRank > targetRank || myRole === "Kurucu") {
                addMenuItem(menu, `🚫 ${t.name} BANLA`, () => quickBanUser(t.name), "menu-danger");
            }
        }

        const allowedRanks = ["Kurucu", "Teknik Servis"];
        if (allowedRanks.includes(myRole)) { 
            addMenuItem(menu, "✥ TAŞIMA MODU", () => setEditMode('move'));  
            addMenuItem(menu, "⤗ BOYUTLANDIRMA MODU", () => setEditMode('resize'));  
            addMenuItem(menu, "✔ KAYDET VE KİLİTLE", () => saveAndLock(), "menu-success");  
        }

        if(menu.innerHTML !== "") {
            menu.style.display = 'block'; 
            menu.style.left = e.clientX + 'px'; 
            menu.style.top = e.clientY + 'px';
        }
    }

    function addMenuItem(p, t, a, c = "") { 
        const d = document.createElement('div'); d.className = "menu-item " + c; d.innerText = t; 
        d.onclick = () => { a(); p.style.display = 'none'; }; p.appendChild(d); 
    }

    document.addEventListener('click', () => document.getElementById('context-menu').style.display = 'none');
    document.addEventListener('contextmenu', (e) => { if(e.target.tagName !== 'INPUT') createContextMenu(e); }, false);

    document.addEventListener('mousedown', (e) => {
        const colorPanel = document.getElementById('color-dropdown');
        const emojiPanel = document.getElementById('emoji-dropdown');
        const colorBtn = document.getElementById('current-color-btn');
        if (colorPanel.style.display === 'flex' && !colorPanel.contains(e.target) && e.target !== colorBtn) colorPanel.style.display = 'none';
        if (emojiPanel.style.display === 'flex' && !emojiPanel.contains(e.target)) emojiPanel.style.display = 'none';
    });

    async function quickVerify(tNick) {
        const currentRole = (myRole || "").toLowerCase().trim();
        const adminRanks = ["kurucu", "admin", "yönetici", "teknik ekip", "teknik servis"];
        const isAdmin = adminRanks.includes(currentRole);
        const isDJ = (currentRole === "dj");

        if (!isAdmin && !isDJ) return;

        const presenceSnap = await db.ref('presence/' + tNick).once('value');
        const pData = presenceSnap.val() || {};
        const hasF = pData.isVerified === true;       
        const hasCheck = pData.tempVerify === true;    

        if (isDJ) {
            await db.ref('presence/' + tNick).update({ tempVerify: !(hasF || hasCheck) });
            return;
        }

        if (isAdmin) {
            if (!hasF && !hasCheck) {
                await db.ref('presence/' + tNick).update({ tempVerify: true, isVerified: false });
            } else if (hasCheck && !hasF) {
                await db.ref('users/' + tNick).update({ isVerified: true, role: "Üye" });
                await db.ref('presence/' + tNick).update({ isVerified: true, tempVerify: false, role: "Üye" });
            } else if (hasF) {
                await db.ref('users/' + tNick).update({ isVerified: false, role: "Misafir" });
                await db.ref('presence/' + tNick).update({ isVerified: false, tempVerify: false, role: "Misafir" });
            }
        }
    }

    function setEditMode(type) {
        if (myRole !== "Kurucu" && myRole !== "Teknik Servis") return alert("Yetkiniz yok!");
        draggies.forEach(d => d.destroy()); 
        draggies = [];
        document.querySelectorAll('.widget-overlay').forEach(el => el.remove());

        widgetIds.forEach(id => {
            const el = document.getElementById(id);
            if(!el) return;
            el.classList.remove('edit-mode-active', 'resize-mode-active');

            if(type === 'move') {
                el.classList.add('edit-mode-active');
                const overlay = document.createElement('div');
                overlay.className = 'widget-overlay';
                el.appendChild(overlay);

                const draggie = new Draggabilly(el, { handle: '.widget-overlay', containment: false });
                draggie.on('dragEnd', function() { 
                    db.ref('layout/'+id).update({ x: this.position.x, y: this.position.y }); 
                });
                draggies.push(draggie);
            } else { 
                el.classList.add('resize-mode-active'); 
            }
        });
    }

    function saveAndLock() {
        draggies.forEach(d => {
            const id = d.element.id;
            db.ref('layout/' + id).update({
                x: Math.round(d.position.x),
                y: Math.round(d.position.y),
                w: Math.round(d.element.offsetWidth),
                h: Math.round(d.element.offsetHeight)
            });
            d.destroy();
        });

        widgetIds.forEach(id => {
            const el = document.getElementById(id);
            if (el && el.classList.contains('resize-mode-active')) {
                 db.ref('layout/'+id).update({
                    w: el.offsetWidth,
                    h: el.offsetHeight,
                    x: parseInt(el.style.left) || el.offsetLeft,
                    y: parseInt(el.style.top) || el.offsetTop
                });
            }
            if(el) el.classList.remove('edit-mode-active', 'resize-mode-active');
        });

        document.querySelectorAll('.widget-overlay').forEach(el => el.remove());
        draggies = [];
        alert("Yerleşim kaydedildi!");
        location.reload(); 
    }

    // --- SADECE FIREBASE İLE ÇALIŞAN GİRİŞ / KAYIT FONKSİYONU ---
async function confirmLogin() { 
    const n = document.getElementById('nick-input').value.trim(); 
    const p = document.getElementById('pass-input').value.trim(); 
    if(!n || !p) return alert("Eksik bilgi!");

    try {
        const snap = await db.ref('users/' + n).once('value');
        const userData = snap.val();

        // Kullanıcı Firebase'de kayıtlı değil -> yeni kayıt oluştur
        if (!userData) {
            if (confirm("Bu nick ile yeni bir kayıt oluşturulsun mu?")) {
                await db.ref('users/' + n).set({ password: p, role: "Misafir", isVerified: false, color: currentColor, joinedAt: Date.now() });

                if(myName && myName.startsWith("Guest")) {
                    await db.ref('presence/' + myName).remove();
                }
                sessionStorage.setItem("filiz_chat_nick", n);
                location.reload();
            }
            return;
        }

        // Kullanıcı kayıtlı -> şifre kontrolü
        if (userData.password !== p) {
            alert("Şifre yanlış!");
            return;
        }

        // Giriş başarılı
        if(myName && myName.startsWith("Guest")) {
            await db.ref('presence/' + myName).remove();
        }
        sessionStorage.setItem("filiz_chat_nick", n);
        location.reload();

    } catch (err) {
        alert("Giriş sırasında bir hata oluştu: " + err.message);
    }
}

    function handleAuthClick() { 
        if(myName && !myName.startsWith("Guest")) { 
            if(confirm("Hesabınızdan çıkış yapmak istiyor musunuz?")) { 
                sessionStorage.clear(); 
                location.reload(); 
            } 
        } else { 
            document.getElementById('login-modal').style.display = 'flex'; 
            document.getElementById('nick-input').focus();
        } 
    }

    function applyColor(c) { 
        if(myRole === "Kurucu" || myPerms.canUseColors === true) { 
            currentColor = c; 
            const colorBtn = document.getElementById('current-color-btn');
            if(colorBtn) colorBtn.style.background = c; 
            localStorage.setItem("filiz_chat_color", c); 
            db.ref('users/' + myName).update({ color: c }); 
            db.ref('presence/' + myName).update({ color: c });
            document.getElementById('color-dropdown').style.display = 'none';
        } else {
            alert("Renk değiştirme yetkiniz bulunmuyor!");
        }
    }

    function initEmojis() { 
        const el = document.getElementById('emoji-list'); 
        if(!el) return;
        ['😊','😂','😍','😎','👍','🔥','❤️','✨','⭐','🎧','📻','🎵'].forEach(e => { 
            const div = document.createElement('div'); 
            div.className='emoji-item'; 
            div.innerText=e; 
            div.onclick=() => { 
                document.getElementById('msg').value += e; 
                document.getElementById('emoji-dropdown').style.display = 'none';
            }; 
            el.appendChild(div); 
        }); 
    }

    function changeFontSize(d) { fontSize += d; document.getElementById('fs-indicator').innerText = fontSize + "px"; loadMessages(); }
    function togglePanel(id) { const t = document.getElementById(id); t.style.display = (t.style.display === 'none') ? 'flex' : 'none'; }
    function toggleStyle(t) { if(t==='bold') isBold=!isBold; else isItalic=!isItalic; document.getElementById('btn-'+t).classList.toggle('active-tool'); }
    function closeLogin() { document.getElementById('login-modal').style.display = 'none'; }
    function fetchRolesAndUsers() { db.ref('role_settings').on('value', rSnap => { allRoles = rSnap.val() || {}; loadUsers(); }); }
    function clearMsgs() { if(confirm("Sohbeti temizle?")) { db.ref('messages').remove().then(() => { db.ref('messages').push().set({ m: `⚠️ Sohbet ${myName} tarafından temizlenmiştir.`, type: "system" }); }); } }
    
    // --- TURSO UYUMLU IP BAN KONTROLÜ ---
    // --- SADECE FIREBASE İLE ÇALIŞAN BAN KONTROLÜ ---
    async function checkBanStatus() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            const myIp = data.ip;
            const safeIp = myIp.replace(/\./g, '_');

            // Firebase'deki banned_ips düğümünden doğrudan kontrol et
            const banSnap = await db.ref('banned_ips/' + safeIp).once('value');
            if (banSnap.exists()) {
                const banData = banSnap.val() || {};
                document.body.innerHTML = `<h1 style='color:red; text-align:center; margin-top:100px;'>ERİŞİM ENGELLENDİ<br><small style='font-size:16px;color:#aaa;'>Sebep: ${escapeHtml(banData.reason || 'Belirtilmemiş')}</small></h1>`;
                return;
            }

            // Banlı değilse: IP Günlüğü için kaydı güncelle
            await db.ref('user_registry/' + myName).update({
                last_ip: myIp,
                last_seen: Date.now()
            });
        } catch (e) {
            console.error("Ban kontrolü yapılamadı:", e);
        }
    }
    
    async function quickBanUser(tNick) {
        const targetSnap = await db.ref('presence/' + tNick).once('value');
        const targetData = targetSnap.val();
        if(!targetData) return alert("Kullanıcı aktif listede bulunamadı.");

        const myRank = rolePriority[myRole] || 0;
        const targetRank = rolePriority[targetData.role] || 0;

        if (myRole !== "Kurucu") {
            if (myRank < targetRank) return alert(`Hata: ${tNick} sizden üst bir rütbede!`);
            if (myRank === targetRank) return alert(`Hata: Kendi rütbe arkadaşınızı banlayamazsınız!`);
        }

        if(!confirm(`${tNick} kullanıcısını kalıcı olarak banlamak istiyor musunuz?`)) return;

        // Firebase'den hedefin son bilinen IP'sini çek
        const regSnap = await db.ref('user_registry/' + tNick).once('value');
        let targetIp = (regSnap.exists() && regSnap.val().last_ip) ? regSnap.val().last_ip : "";

        if(targetIp) {
            try {
                const safeIp = targetIp.replace(/\./g, '_');
                await db.ref('banned_ips/' + safeIp).set({
                    nick: tNick,
                    date: Date.now(),
                    reason: "Sohbet içerisinden hızlı ban"
                });
                await db.ref('presence/' + tNick).remove();
                alert(`${tNick} başarıyla uzaklaştırıldı.`);
            } catch(e) {
                alert("Ban işlemi başarısız: " + e.message);
            }
        } else {
            alert("Kullanıcının IP adresi bulunamadığı için sadece odadan düşürüldü.");
            await db.ref('presence/' + tNick).remove();
        }
    }

    function checkEnter(event) { if (event.key === "Enter") confirmLogin(); }

    function toggleUserActions(nick) {
        const safeId = "actions-" + nick.replace(/\s+/g, '_');
        const panel = document.getElementById(safeId);
        if(panel) {
            document.querySelectorAll('.quick-action-panel').forEach(p => { if(p.id !== safeId) p.style.display = 'none'; });
            panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
        }
    }

    // --- KICK (Sohbetten Atma) sinyalini dinler ---
    // Eskiden sadece presence kaydı siliniyordu, ama bu kişinin mesaj okumasını engellemiyordu
    // (onay durumu presence'tan bağımsız, users düğümünde kalıcı olarak tutuluyor). Şimdi ayrı bir
    // "kicked" sinyali kullanılıyor: bu sinyal geldiği anda mesaj dinleyicisi durdurulup ekran kilitleniyor.
    function listenForKick() {
        db.ref('kicked/' + myName).on('value', snap => {
            if (snap.exists()) {
                // Mesaj akışını durdur
                db.ref('messages').off();
                db.ref('presence/' + myName).remove();
                db.ref('kicked/' + myName).remove();

                const win = document.getElementById('chat-window');
                if (win) win.innerHTML = `<div class="system-msg" style="border-color:#ff4b2b; color:#ff4b2b; background:rgba(255,75,43,0.15);">⚠️ Sohbet bağlantınız koptu.<br>Devam etmek için sayfayı yenileyin.</div>`;

                const msgInput = document.getElementById('msg');
                if (msgInput) { msgInput.disabled = true; msgInput.placeholder = "Bağlantı koptu, sayfayı yenileyin..."; }

                const toolsWidget = document.getElementById('tools-widget');
                if (toolsWidget) { toolsWidget.style.opacity = "0.3"; toolsWidget.style.pointerEvents = "none"; }
            }
        });
    }

    async function kickUser(tNick) {
        if(confirm(tNick + " kullanıcısını sohbetten atmak istiyor musunuz?")) {
            await db.ref('presence/' + tNick).remove();
            await db.ref('kicked/' + tNick).set(Date.now()); // Atılan kişinin ekranına anında ulaşan sinyal
            db.ref('messages').push().set({ u: "SİSTEM", m: `⚠️ ${tNick} kurallar gereği sohbetten uzaklaştırıldı.`, type: "system" });
            alert(tNick + " atıldı.");
        }
    }

    // BANLILAR widget'ı ve popup'ı kaldırıldı; ilgili fonksiyonlar (checkBanViewPerms,
    // toggleBanList, loadBanListToPopup, removeBanFromSohbet) da bununla birlikte temizlendi.
</script>
